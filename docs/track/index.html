<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pawkit Visit Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Layout: one phone-width column. Headline status first, then arrival time, the five steps, the map (only while travelling), help last. */
:root{
  --bg:#f3fbf9; --surface:#ffffff; --line:#d8ebe7; --ink:#1f3531; --ink2:#55706a;
  --brand:#007f78; --brand-soft:#e3f6f2; --on-brand:#ffffff;
  --warn:#8a5a00; --warn-bg:#fff1cf; --bad:#a3271d; --bad-bg:#fde3df; --good:#1c6b3a; --good-bg:#dcf3e3;
  --font:"Lato","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0f1b19; --surface:#172624; --line:#2c423e; --ink:#e6f2ef; --ink2:#9db8b1;
  --brand:#3fc3b8; --brand-soft:#1d3a36; --on-brand:#06211e;
  --warn:#f0c46a; --warn-bg:#3a2f12; --bad:#f29a90; --bad-bg:#3d1c18; --good:#86d6a1; --good-bg:#17341f; color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:20px;color:var(--brand);letter-spacing:-.01em}
.live{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.live.stale .dot{background:var(--warn)}
@media (prefers-reduced-motion: no-preference){ .live:not(.stale) .dot{animation:pulse 1.6s ease-in-out infinite} }
@keyframes pulse{50%{opacity:.25}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
h1{margin:0;font-size:clamp(22px,6.2vw,28px);font-weight:900;line-height:1.2;text-wrap:balance}
.sub{margin:0;color:var(--ink2)}
.eta{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.eta b{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}
.eta span{color:var(--ink2)}
.note{margin:0;border-radius:10px;padding:9px 12px;font-size:15px}
.note.warn{background:var(--warn-bg);color:var(--warn)} .note.bad{background:var(--bad-bg);color:var(--bad)} .note.good{background:var(--good-bg);color:var(--good)}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:26px 1fr;gap:12px;position:relative;padding-bottom:16px;color:var(--ink2)}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";width:18px;height:18px;border-radius:50%;border:3px solid var(--line);background:var(--surface);margin:3px 4px 0}
.steps li::after{content:"";position:absolute;left:12px;top:24px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child::after{display:none}
.steps li.done{color:var(--ink)}
.steps li.done::before{background:var(--brand);border-color:var(--brand)}
.steps li.done::after{background:var(--brand)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.steps small{display:block;font-weight:400;color:var(--ink2);font-size:13.5px}
#map{height:260px;border-radius:12px;border:1px solid var(--line);z-index:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:12px;background:var(--brand);color:var(--on-brand);font-weight:700;text-decoration:none;text-align:center}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
footer{color:var(--ink2);font-size:13.5px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="logo">Pawkit</span>
    <span class="live" id="live" hidden><span class="dot"></span><span id="liveTxt">Live</span></span>
  </header>

  <section class="card" id="main" aria-live="polite">
    <h1 id="head">Loading your visit…</h1>
    <p class="sub" id="sub"></p>
    <div class="eta" id="etaRow" hidden><b id="etaTime"></b><span id="etaLabel"></span></div>
    <p class="note" id="note" hidden></p>
  </section>

  <section class="card" id="stepsCard" hidden>
    <ol class="steps" id="steps"></ol>
  </section>

  <section class="card" id="mapCard" hidden>
    <p class="sub" id="mapTxt"></p>
    <div id="map"></div>
  </section>

  <a class="btn ghost" id="gmaps" hidden target="_blank" rel="noopener">Open the provider's live location in Google Maps</a>
  <a class="btn" id="help" href="https://wa.me/6588540207" target="_blank" rel="noopener">Message Pawkit on WhatsApp</a>
  <footer>This page updates by itself. It shows the visit status only, never your address or phone number.</footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  var API = (window.PAWKIT_TRACK && window.PAWKIT_TRACK.api) || '';
  var r = (new URLSearchParams(location.search).get('t') || '').toLowerCase();
  var $ = function(id){ return document.getElementById(id); };
  var map = null, marker = null, lastOk = 0;

  var ORDER = ['Confirmed','On the way','Arrived','In progress','Completed'];
  var LABEL = {'Confirmed':'Visit confirmed','On the way':'On the way','Arrived':'Arrived','In progress':'Service in progress','Completed':'Visit complete'};

  function clock(iso){
    if(!iso) return '';
    var d = new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleTimeString('en-SG',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Singapore'});
  }
  function day(iso){
    var d = new Date(iso); if(isNaN(d)) return '';
    return d.toLocaleDateString('en-SG',{weekday:'short',day:'numeric',month:'short',timeZone:'Asia/Singapore'});
  }
  function show(el, on){ el.hidden = !on; }

  function gone(msg){
    $('head').textContent = msg || 'This tracking link is no longer active';
    $('sub').textContent = 'Links stop working after the visit. If you need help with a booking, message us on WhatsApp.';
    ['etaRow','note','stepsCard','mapCard','gmaps','live'].forEach(function(id){ show($(id), false); });
  }

  function render(v){
    var prov = v.prov || 'Your provider', pet = v.pet || 'your pet', s = v.s || '';
    var svc = (v.svc || 'visit').toLowerCase();
    var head = '', sub = pet + "'s " + svc + (v.t ? ' · ' + day(v.t) + ', ' + clock(v.t) : '');
    var note = null, stage = s, etaLabel = '', etaTime = '';

    if(s === 'Delayed'){ stage = 'On the way'; }
    if(s === '' || s === 'Awaiting provider'){ stage = ''; head = 'Your visit is booked'; etaTime = clock(v.t); etaLabel = 'scheduled time'; }
    else if(s === 'Confirmed'){ head = prov + ' has confirmed the visit'; etaTime = clock(v.t); etaLabel = 'scheduled time'; }
    else if(s === 'On the way'){ head = prov + ' is on the way'; etaTime = clock(v.eta || v.t); etaLabel = 'expected arrival'; }
    else if(s === 'Delayed'){ head = prov + ' is running late'; etaTime = clock(v.eta || v.t); etaLabel = 'new expected arrival';
      note = ['warn', 'About ' + (v.dm || 'a few') + ' minutes later than planned. Sorry for the wait.']; }
    else if(s === 'Arrived'){ head = prov + ' has arrived'; }
    else if(s === 'In progress'){ head = pet + "'s " + svc + ' is in progress'; }
    else if(s === 'Completed'){ head = 'The visit is complete'; note = ['good', 'Thank you for booking with Pawkit.']; }
    else if(s === 'Provider declined' || s === 'Needs reschedule'){ stage = ''; head = 'We are rearranging your visit'; note = ['warn', 'Our team will message you on WhatsApp with the next step.']; }
    else if(s === 'Cancelled' || s === 'Not completed'){ stage = ''; head = 'This visit did not go ahead'; note = ['bad', 'Our team will message you on WhatsApp.']; }
    else { head = 'Your visit is booked'; stage = ''; }

    $('head').textContent = head;
    $('sub').textContent = sub;
    show($('etaRow'), !!etaTime); $('etaTime').textContent = etaTime; $('etaLabel').textContent = etaLabel;
    show($('note'), !!note); if(note){ $('note').className = 'note ' + note[0]; $('note').textContent = note[1]; }

    var idx = ORDER.indexOf(stage), ol = $('steps'); ol.textContent = '';
    ORDER.forEach(function(name, i){
      var li = document.createElement('li'), box = document.createElement('div');
      box.textContent = LABEL[name];
      if(i < idx || (stage === 'Completed' && i === idx)) li.className = 'done';
      else if(i === idx) li.className = 'now';
      if(i === idx && name === 'On the way' && (v.eta || v.t)){ var sm = document.createElement('small'); sm.textContent = 'Expected ' + clock(v.eta || v.t); box.appendChild(sm); }
      li.appendChild(document.createElement('span')).remove();
      li.appendChild(box); ol.appendChild(li);
    });
    show($('stepsCard'), idx >= 0);

    var travelling = (s === 'On the way' || s === 'Delayed');
    var hasPos = travelling && typeof v.lat === 'number' && typeof v.lng === 'number';
    show($('mapCard'), hasPos);
    if(hasPos){
      var age = Math.max(0, Math.round(((v.now || Date.now()) - v.lu) / 1000));
      $('mapTxt').textContent = prov + "'s position, updated " + (age < 60 ? age + ' seconds' : Math.round(age/60) + ' min') + ' ago';
      if(!map){
        map = L.map('map', {zoomControl:true, attributionControl:true}).setView([v.lat, v.lng], 15);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
        marker = L.circleMarker([v.lat, v.lng], {radius:10, color:'#ffffff', weight:3, fillColor:'#007f78', fillOpacity:1}).addTo(map);
      } else { marker.setLatLng([v.lat, v.lng]); map.panTo([v.lat, v.lng]); }
      setTimeout(function(){ map.invalidateSize(); }, 50);
    }
    var ok = travelling && /^https:\/\/(maps\.app\.goo\.gl|www\.google\.com\/maps|goo\.gl\/maps)\//.test(v.link || '');
    show($('gmaps'), ok); if(ok) $('gmaps').href = v.link;
  }

  function tick(){
    fetch(API + '?r=' + encodeURIComponent(r), {cache:'no-store'}).then(function(x){ return x.json(); }).then(function(j){
      if(!j || !j.ok){ gone(); return; }
      lastOk = Date.now(); render(j.v);
      show($('live'), true); $('live').className = 'live'; $('liveTxt').textContent = 'Live';
    }).catch(function(){
      if(lastOk){ $('live').className = 'live stale'; $('liveTxt').textContent = 'Reconnecting'; }
      else { $('head').textContent = 'Trying to load your visit…'; }
    });
  }

  if(!/^[0-9a-f]{32}$/.test(r) || !API){ gone(API ? 'This tracking link is not valid' : 'Tracking is not set up yet'); return; }
  tick(); setInterval(function(){ if(!document.hidden) tick(); }, 15000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) tick(); });
})();
</script>
</body>
</html>
